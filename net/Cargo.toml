[package]
name = "net"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
libp2p = { version = "0.54", features = ["tokio", "quic", "mdns", "gossipsub", "macros", "noise", "yamux"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
