[package]
name = "mobile-bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
core-daemon = { path = "../core-daemon" }
platform-adapters = { path = "../platform-adapters" }
tokio = { workspace = true, features = ["full"] }
crossbeam-channel = { workspace = true }
once_cell = "1.19"
