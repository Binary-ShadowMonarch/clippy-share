[package]
name = "platform-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
crossbeam-channel = { workspace = true }
once_cell = "1.19"
log = "0.4"

# Wayland dependencies - only on desktop Linux (not Android)
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
arboard = "3"
wayland-clipboard-listener = { git = "https://github.com/Decodetalkers/wayland-clipboard-listener" }
calloop = "0.12"
wayland-protocols = "0.31"
wayland-protocols-wlr = "0.3"
wayland-client = "0.31"

# Windows dependencies
[target.'cfg(windows)'.dependencies]
# Add Windows-specific clipboard libraries here when implementing
# For example: clipboard-win = "4.5"

# Android dependencies
[target.'cfg(target_os = "android")'.dependencies]
# Android-specific dependencies if needed
